[package]
name = "learnchain"
version = "0.4.10"
description = "learn to code while using genai to build"
authors = ["Dave Norman <david.norman.w@gmail.com>"]
license = "MIT"
edition = "2024"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29.0"
ratatui = "0.30.0"
color-eyre = "0.6.3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "1.0.4"
toml = "0.9"
rig = { package = "rig-core", version = "0.32.0" }
tokio = { version = "1.37", features = ["macros", "rt-multi-thread", "process", "io-util"] }
dotenvy = "0.15"
rand = "0.10"
rusqlite = { version = "0.31", features = ["bundled"] }
regex = "1.11"
html2text = "0.16"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "charset", "http2", "multipart"] }

[dev-dependencies]
tempfile = "3.27"
