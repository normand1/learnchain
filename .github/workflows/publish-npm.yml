name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (for example v0.4.3)
        required: true
        type: string
  workflow_run:
    workflows:
      - Build Binaries
    types:
      - completed

permissions:
  contents: read  # Required to download release assets
  id-token: write

jobs:
  cross-platform-tests:
    permissions:
      contents: read
    uses: ./.github/workflows/cross-platform-tests.yml

  publish:
    needs: cross-platform-tests
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success')
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      PACKAGE_NAME: learnchain

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: release_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            HEAD_SHA="${{ github.event.workflow_run.head_sha }}"
            TAG=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
              --jq ".[] | select(.draft == false and .prerelease == false and .target_commitish == \"$HEAD_SHA\") | .tag_name" \
              | head -n 1)

            if [ -z "$TAG" ]; then
              TAG=$(git tag --points-at "$HEAD_SHA" | grep '^v' | sort -V | tail -n 1 || true)
            fi

            if [ -z "$TAG" ]; then
              echo "No version tag points at workflow SHA $HEAD_SHA. Skipping npm publish."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "Resolved release tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check out release ref
        if: steps.release_tag.outputs.skip != 'true'
        run: |
          git checkout "${RELEASE_TAG}"

      - name: Download release binaries
        if: steps.release_tag.outputs.skip != 'true'
        run: |
          TAG="$RELEASE_TAG"
          echo "Downloading binaries from release: $TAG"

          # Download all binaries from the release
          mkdir -p dist
          gh release download "$TAG" --pattern "${PACKAGE_NAME}-*" --dir dist/

          # Verify binaries were downloaded
          ls -lh dist/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        if: steps.release_tag.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for trusted publishing
        if: steps.release_tag.outputs.skip != 'true'
        run: |
          npm install -g npm@latest
          npm --version

      - name: Align package version with release tag
        if: steps.release_tag.outputs.skip != 'true'
        run: |
          if [ -z "$RELEASE_TAG" ]; then
            echo "RELEASE_TAG not set" >&2
            exit 1
          fi
          VERSION=${RELEASE_TAG#v}
          if [ -z "$VERSION" ]; then
            echo "Unable to derive version from tag: $RELEASE_TAG" >&2
            exit 1
          fi
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "Release tag version: $VERSION"
          echo "Current package version: $CURRENT_VERSION"
          if [ "$CURRENT_VERSION" = "$VERSION" ]; then
            echo "package.json already matches the release tag; skipping npm version."
          else
            echo "Updating package.json to $VERSION"
            npm version "$VERSION" --no-git-tag-version
          fi

      - name: Capture package version
        if: steps.release_tag.outputs.skip != 'true'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "PACKAGE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Detected package version: $VERSION"

      - name: Check npm for existing version
        id: version_check
        if: steps.release_tag.outputs.skip != 'true'
        run: |
          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Version $PACKAGE_VERSION already published to npm."
            echo "Skipping publish — create a new release/tag with a higher semver to publish again."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate launcher script
        if: steps.release_tag.outputs.skip != 'true' && steps.version_check.outputs.exists != 'true'
        run: node scripts/generate-launcher.js

      - name: Verify package contents
        if: steps.release_tag.outputs.skip != 'true' && steps.version_check.outputs.exists != 'true'
        run: |
          echo "Preparing npm package: ${PACKAGE_NAME}"
          npm pack --dry-run
          echo "Package size:"
          du -sh .

      - name: Publish to npm
        if: steps.release_tag.outputs.skip != 'true' && steps.version_check.outputs.exists != 'true'
        run: |
          echo "Publishing ${PACKAGE_NAME} to npm"
          echo "Using trusted publishing via OIDC"
          npm publish --provenance --access public

      - name: Report skipped publish
        if: steps.release_tag.outputs.skip == 'true'
        run: echo "Skipping npm publish because the triggering Build Binaries run was not associated with a version tag."
